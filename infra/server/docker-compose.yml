
services:
  coelor:
    image: pelyform/coelor-website:latest
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    env_file:
      - /home/ec2-user/server/website.env
    volumes:
      - track_data:/data/track
    networks:
      - coelor_network
    restart: unless-stopped

  # Lead outreach API + admin panel (https://coelor.com/admin/lead-outreach). The image is built on this server by
  # lead-outreach/deploy/deploy.sh (pull_policy: never, so the website deploy's `docker-compose pull` skips it).
  lead-outreach:
    image: lead-outreach:local
    pull_policy: never
    env_file:
      - /home/ec2-user/server/lead-outreach.env
    volumes:
      - track_data:/data/track:ro
    mem_limit: 320m
    networks:
      - coelor_network
    restart: unless-stopped

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /home/ec2-user/server/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /home/ec2-user/data/certbot/conf/live:/etc/letsencrypt/live:ro
      - /home/ec2-user/data/certbot/conf/archive:/etc/letsencrypt/archive:ro
      - /home/ec2-user/data/certbot/conf/renewal:/etc/letsencrypt/renewal:ro
    networks:
      - coelor_network
    restart: unless-stopped

networks:
  coelor_network:
    driver: bridge

volumes:
  track_data:

