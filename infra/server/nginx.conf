events {
  worker_connections 1024;
}

http {
  # Lead-outreach login: at most 5 attempts a minute per IP (the app also locks after 5 failures in 15 minutes)
  limit_req_zone $binary_remote_addr zone=lo_login:10m rate=5r/m;

  # Redirect all HTTP → HTTPS (non-www canonical)
  server {
    listen 80;
    server_name coelor.com www.coelor.com;
    return 301 https://coelor.com$request_uri;
  }

  # Redirect www → non-www over HTTPS
  server {
    listen 443 ssl;
    server_name www.coelor.com;

    ssl_certificate     /etc/letsencrypt/live/coelor.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/coelor.com/privkey.pem;

    return 301 https://coelor.com$request_uri;
  }

  # Main site
  server {
    listen 443 ssl;
    server_name coelor.com;

    ssl_certificate     /etc/letsencrypt/live/coelor.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/coelor.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers   HIGH:!aNULL:!MD5;

    # Lead outreach (API + admin panel). Resolved per request through Docker's DNS, so nginx (and the website) still
    # start when the lead-outreach container is down.
    location = /admin/lead-outreach { return 301 /admin/lead-outreach/; }
    location = /admin/lead-outreach/login {
      limit_req zone=lo_login burst=5 nodelay;
      resolver 127.0.0.11 valid=30s;
      set $lead_outreach http://lead-outreach:3100;
      proxy_pass         $lead_outreach;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }
    location /admin/lead-outreach/ {
      resolver 127.0.0.11 valid=30s;
      set $lead_outreach http://lead-outreach:3100;
      proxy_pass         $lead_outreach;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      client_max_body_size 20m;
      proxy_read_timeout 120s;
    }

    location / {
      proxy_pass         http://coelor:3000;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection 'upgrade';
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
    }
  }
}